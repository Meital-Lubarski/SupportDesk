<div class="modal-backdrop" (click)="cancel.emit()">
  <div class="card modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>New conversation</h2>
      <button type="button" class="icon-button" (click)="cancel.emit()" aria-label="Close">&times;</button>
    </div>

    <form (submit)="$event.preventDefault(); submit()">
      <div class="field">
        <label for="new-customer-name">Customer name</label>
        <input
          id="new-customer-name"
          type="text"
          [(ngModel)]="customerName"
          name="customerName"
          required
        />
      </div>

      <div class="field">
        <label for="new-customer-email">Customer email</label>
        <input
          id="new-customer-email"
          type="email"
          [(ngModel)]="customerEmail"
          name="customerEmail"
          required
        />
      </div>

      <div class="field">
        <label for="new-subject">Subject</label>
        <input
          id="new-subject"
          type="text"
          [(ngModel)]="subject"
          name="subject"
          required
        />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="new-priority">Priority</label>
          <select id="new-priority" [(ngModel)]="priority" name="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
          </select>
        </div>

        <div class="field">
          <label for="new-assignee">Assignee</label>
          <select id="new-assignee" [(ngModel)]="assignedTo" name="assignedTo">
            <option value="">Unassigned</option>
            @for (agent of agents; track agent) {
              <option [value]="agent">{{ agent }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field">
        <label for="new-tags">Tags</label>
        <app-tag-editor inputId="new-tags" [tags]="tags" (tagsChange)="tags = $event" />
      </div>

      @if (errorMessage) {
        <p class="form-error">{{ errorMessage }}</p>
      }

      <div class="modal-actions">
        <button type="button" class="secondary" (click)="cancel.emit()">Cancel</button>
        <button type="submit" [disabled]="creating">
          @if (creating) {
            Creating...
          } @else {
            Create conversation
          }
        </button>
      </div>
    </form>
  </div>
</div>
