<div class="tag-list">
  @for (tag of tags; track tag) {
    <span class="tag-chip">
      {{ tag }}
      <button type="button" class="tag-remove" (click)="removeTag(tag)" aria-label="Remove tag">&times;</button>
    </span>
  }
</div>
<div class="tag-input-row">
  <input
    [id]="inputId"
    type="text"
    placeholder="Add a tag and press Enter"
    [ngModel]="newTag()"
    (ngModelChange)="newTag.set($event)"
    name="newTag"
    [ngModelOptions]="{ standalone: true }"
    (keydown.enter)="$event.preventDefault(); addTag()"
  />
  <button type="button" class="secondary" (click)="addTag()">Add</button>
</div>
